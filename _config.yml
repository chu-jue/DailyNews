# Hexo Configuration

# Site
title: DailyNews 每日新闻
subtitle: 每日科技/AI/美股新闻简报
description: 每天更新的科技、AI、美股新闻
keywords: news, AI, tech, stock, 美股
author: 教官
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://chu-jue.github.io/DailyNews
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 新闻
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
include:
exclude:
ignore:

# Extensions
theme: landscape

# Deployment
deploy:
  type: git
  repo: https://github.com/chu-jue/DailyNews.git
  branch: gh-pages
  message: "📰 Update site - {{ now('YYYY-MM-DD HH:mm') }}"
